name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, build, and audit
    # Pin Ubuntu 24.04. ubuntu-latest moves to Ubuntu 26 on 19 October 2026.
    # checkout and setup-node v7 run on Node 24. The app itself stays on Node 26.
    # The full `npm audit` step still reports the dev-only braces findings and is allowed to continue.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test with coverage thresholds
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke tests
        run: npm run test:e2e

      # Production dependencies fail the job at high or critical.
      # The full tree, including devDependencies, fails the job at critical.
      # High findings limited to the dev-only braces/micromatch/fast-glob
      # chain are printed below and do not fail the job: braces 3.0.3 is the
      # latest release and is still affected, and npm's suggested fix is an
      # incompatible major downgrade of eslint-config-next or shadcn.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit for critical vulnerabilities
        run: npm audit --audit-level=critical

      - name: Report full dependency audit
        run: npm audit
        continue-on-error: true
